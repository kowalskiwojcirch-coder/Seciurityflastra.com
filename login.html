<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Login | Security Flastra</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .navbar { background: #333; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #fff; text-decoration: none; margin-right: 15px; }
        .login-container, .profile-card { background: #fff; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { padding: 8px 12px; margin-top: 10px; cursor: pointer; }
        .error-message { color: red; font-weight: bold; margin-top: 5px; }
        .profile-avatar { font-size: 60px; margin-bottom: 10px; display: block; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 10px; }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Securityflastra.com</div>
        <div>
            <a href="index.html">Home Page</a>
            <a href="secretary.html">Secretary</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <section class="login-section">
        <!-- PROFIL ZALOGOWANEGO UŻYTKOWNIKA -->
        <div id="profilePanel" class="profile-panel" style="display: none;">
            <div class="profile-card">
                <img id="profileAvatar" class="profile-img" src="" alt="Avatar" style="display:none;">
                <div id="profileEmoji" class="profile-avatar">👤</div>
                <h2 id="profileName"></h2>
                <p id="profileEmail"></p>
                <button id="logoutBtn">Wyloguj się</button>
                <!-- przycisk Ustawienia dodawany JS -->
            </div>
        </div>

        <!-- LOGOWANIE -->
        <div id="loginDiv" class="login-container">
            <h1>Logowanie</h1>
            <input type="text" id="loginEmail" placeholder="Email lub nazwa" required>
            <input type="password" id="loginPass" placeholder="Hasło" required>
            <button id="loginBtn">Zaloguj się</button>
            <p>
                Nie masz konta? 
                <button id="toRegister" style="background:none;border:none;color:#4da3ff;text-decoration:underline;cursor:pointer;padding:0;">Rejestracja</button>
            </p>
            <div id="loginError" class="error-message" style="display: none;"></div>
        </div>

        <!-- REJESTRACJA -->
        <div id="registerDiv" class="login-container" style="display: none;">
            <h1>Rejestracja</h1>
            <input type="text" id="regUsername" placeholder="Nazwa użytkownika" required>
            <input type="text" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPass" placeholder="Hasło" required>
            <input type="password" id="regPassConf" placeholder="Potwierdź hasło" required>
            <div class="checkbox-group">
                <input type="checkbox" id="privacyCheck" required>
                <label for="privacyCheck">Akceptuję <strong>politykę prywatności</strong> i <strong>pliki cookies</strong></label>
            </div>
            <button id="registerBtn">Zarejestruj się</button>
            <p>
                Masz już konto? 
                <button id="toLogin" style="background:none;border:none;color:#4da3ff;text-decoration:underline;cursor:pointer;padding:0;">Logowanie</button>
            </p>
            <div id="regError" class="error-message" style="display: none;"></div>
        </div>

        <!-- USTAWIENIA -->
        <div id="settingsDiv" class="login-container" style="display: none;">
            <h1>Ustawienia konta (Beta 1.2)</h1>
            <label>Awatar (URL zdjęcia):</label>
            <input type="text" id="avatarInput" placeholder="Np. https://example.com/avatar.jpg">
            <label>Nazwa użytkownika:</label>
            <input type="text" id="nameInput" placeholder="Nowa nazwa">
            <label>Hasło:</label>
            <input type="password" id="passInput" placeholder="Nowe hasło">
            <button id="saveSettings">Zapisz zmiany</button>
            <button id="backProfile" style="margin-top:5px;">Powrót do profilu</button>
            <div id="settingsMsg" class="error-message"></div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024-2026 Security Flastra. Wszystkie prawa zastrzeżone.</p>
    </footer>

    <script>
        let userData = JSON.parse(localStorage.getItem('appUsers')) || {};

        // PRZEŁĄCZANIE FORMULARZY
        document.getElementById('toRegister').onclick = e => {
            e.preventDefault();
            loginDiv.style.display='none'; registerDiv.style.display='block';
        };
        document.getElementById('toLogin').onclick = e => {
            e.preventDefault();
            registerDiv.style.display='none'; loginDiv.style.display='block';
        };

        // REJESTRACJA
        document.getElementById('registerBtn').onclick = function() {
            const username=document.getElementById('regUsername').value.trim();
            const email=document.getElementById('regEmail').value.trim();
            const pass=document.getElementById('regPass').value;
            const passConf=document.getElementById('regPassConf').value;
            const privacyOk=document.getElementById('privacyCheck').checked;
            const errDiv=document.getElementById('regError');
            errDiv.style.display='none';

            if(!privacyOk){errDiv.textContent='❌ Musisz zaakceptować politykę prywatności!';errDiv.style.display='block'; return;}
            if(pass!==passConf){errDiv.textContent='❌ Hasła się nie zgadzają!';errDiv.style.display='block'; return;}
            if(pass.length<6){errDiv.textContent='❌ Hasło musi mieć co najmniej 6 znaków!';errDiv.style.display='block'; return;}
            if(userData[email]){errDiv.textContent='❌ Ten email już istnieje!';errDiv.style.display='block'; return;}

            userData[email]={username,email,password:pass,avatar:''};
            localStorage.setItem('appUsers',JSON.stringify(userData));
            localStorage.setItem('loggedUser',email);
            document.getElementById('regUsername').value=''; document.getElementById('regEmail').value='';
            document.getElementById('regPass').value=''; document.getElementById('regPassConf').value=''; document.getElementById('privacyCheck').checked=false;

            showProfile(userData[email]);
        };

        // LOGOWANIE
        document.getElementById('loginBtn').onclick = function() {
            const input=document.getElementById('loginEmail').value.trim();
            const pass=document.getElementById('loginPass').value;
            const errDiv=document.getElementById('loginError'); errDiv.style.display='none';
            let found=null;
            for(let key in userData){
                const u=userData[key];
                if((u.email===input||u.username===input)&&u.password===pass){found=u;break;}
            }
            if(found){localStorage.setItem('loggedUser',found.email); showProfile(found);}
            else{errDiv.textContent='❌ Błędny email/nazwa lub hasło!'; errDiv.style.display='block';}
        };

        // WYLOGOWANIE
        document.getElementById('logoutBtn').onclick=function(){
            localStorage.removeItem('loggedUser');
            profilePanel.style.display='none';
            loginDiv.style.display='block';
            registerDiv.style.display='none';
            loginEmail.value=''; loginPass.value='';
        };

        // POKAŻ PROFIL + USTAWIENIA
        function showProfile(user){
            loginDiv.style.display='none'; registerDiv.style.display='none'; settingsDiv.style.display='none'; profilePanel.style.display='block';
            profileName.textContent=user.username; profileEmail.textContent=user.email;

            if(user.avatar){
                profileAvatar.src=user.avatar; profileAvatar.style.display='block'; profileEmoji.style.display='none';
            }else{
                profileAvatar.style.display='none'; profileEmoji.style.display='block';
            }

            if(!document.getElementById('settingsBtn')){
                const btn=document.createElement('button'); btn.id='settingsBtn'; btn.textContent='Ustawienia';
                btn.style.marginTop='10px'; btn.style.background='#4da3ff'; btn.style.color='#fff'; btn.style.border='none';
                btn.style.padding='5px 10px'; btn.style.cursor='pointer';
                btn.onclick=function(){
                    profilePanel.style.display='none'; settingsDiv.style.display='block';
                    avatarInput.value=user.avatar||''; nameInput.value=user.username; passInput.value=''; settingsMsg.textContent='';
                };
                profileCard.appendChild(btn);

                const beta=document.createElement('p'); beta.textContent='Ta funkcja jest w becie 1.2';
                beta.style.fontSize='12px'; beta.style.color='#888'; beta.style.marginTop='5px';
                profileCard.appendChild(beta);
            }
        }

        // ZAPISZ ZMIANY
        saveSettings.onclick=function(){
            const logged=localStorage.getItem('loggedUser'); if(!logged||!userData[logged]) return;
            const user=userData[logged];
            const avatar=avatarInput.value.trim(); const name=nameInput.value.trim(); const pass=passInput.value; const msg=settingsMsg;
            msg.style.color='red'; msg.textContent='';
            if(name.length<1){msg.textContent='❌ Nazwa użytkownika nie może być pusta!'; return;}
            if(pass&&pass.length<6){msg.textContent='❌ Hasło musi mieć co najmniej 6 znaków!'; return;}
            user.username=name; if(pass) user.password=pass; user.avatar=avatar;
            userData[logged]=user; localStorage.setItem('appUsers',JSON.stringify(userData));
            msg.style.color='green'; msg.textContent='✅ Zmiany zapisane!';
        };

        // POWRÓT DO PROFILU
        backProfile.onclick=function(){
            const logged=localStorage.getItem('loggedUser'); if(logged&&userData[logged]) showProfile(userData[logged]);
        };

        // SPRAWDŹ ZALOGOWANIE
        window.onload=function(){
            const logged=localStorage.getItem('loggedUser');
            if(logged&&userData[logged]) showProfile(userData[logged]);
        };
    </script>
</body>
</html>
