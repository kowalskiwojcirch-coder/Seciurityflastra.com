<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Login | Security Flastra</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container { max-width: 400px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .profile-card { text-align: center; padding: 20px; border: 1px solid #ccc; border-radius: 8px; max-width: 400px; margin: 20px auto; }
        .error-message { color: red; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
        button { padding: 8px 12px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Securityflastra.com</div>
        <ul class="nav-links">
            <li><a href="index.html">Home Page</a></li>
            <li><a href="secretary.html">Secretary</a></li>
            <li><a href="login.html">Login</a></li>
            <li class="search">🔍</li>
        </ul>
    </nav>

    <section class="login-section">
        <!-- PROFIL ZALOGOWANEGO UŻYTKOWNIKA -->
        <div id="profilePanel" class="profile-panel" style="display: none;">
            <div class="profile-card">
                <div class="profile-avatar">👤</div>
                <h2 id="profileName"></h2>
                <p id="profileEmail"></p>
                <button id="logoutBtn" class="logout-btn">Wyloguj się</button>
                <!-- przycisk Ustawienia i info beta dodawane dynamicznie w JS -->
            </div>
        </div>

        <!-- LOGOWANIE -->
        <div id="loginDiv" class="login-container">
            <h1>Logowanie</h1>
            <input type="text" id="loginEmail" placeholder="Email lub nazwa" required>
            <input type="password" id="loginPass" placeholder="Hasło" required>
            <button id="loginBtn">Zaloguj się</button>
            <p>
                Nie masz konta? 
                <button id="toRegister" style="background: none; border: none; color: #4da3ff; cursor: pointer; text-decoration: underline; padding: 0;">
                    Rejestracja
                </button>
            </p>
            <div id="loginError" class="error-message" style="display: none;"></div>
        </div>

        <!-- REJESTRACJA -->
        <div id="registerDiv" class="login-container" style="display: none;">
            <h1>Rejestracja</h1>
            <input type="text" id="regUsername" placeholder="Nazwa użytkownika" required>
            <input type="text" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPass" placeholder="Hasło" required>
            <input type="password" id="regPassConf" placeholder="Potwierdź hasło" required>
            <div class="checkbox-group">
                <input type="checkbox" id="privacyCheck" required>
                <label for="privacyCheck">
                    Akceptuję <strong>politykę prywatności</strong> i <strong>pliki cookies</strong>
                </label>
            </div>
            <button id="registerBtn">Zarejestruj się</button>
            <p>
                Masz już konto? 
                <button id="toLogin" style="background: none; border: none; color: #4da3ff; cursor: pointer; text-decoration: underline; padding: 0;">
                    Logowanie
                </button>
            </p>
            <div id="regError" class="error-message" style="display: none;"></div>
        </div>

        <!-- USTAWIENIA NA TEJ SAMEJ STRONIE -->
        <div id="settingsDiv" class="login-container" style="display: none;">
            <h1>Ustawienia konta (Beta 1.2)</h1>
            <label>Awatar (emoji):</label>
            <input type="text" id="avatarInput" placeholder="Np. 👤">
            
            <label>Nazwa użytkownika:</label>
            <input type="text" id="nameInput" placeholder="Nowa nazwa">

            <label>Hasło:</label>
            <input type="password" id="passInput" placeholder="Nowe hasło">

            <button id="saveSettings">Zapisz zmiany</button>
            <button id="backProfile" style="margin-top:5px;">Powrót do profilu</button>
            <div id="settingsMsg" style="color: red; margin-top: 10px;"></div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024-2026 Security Flastra. Wszystkie prawa zastrzeżone.</p>
    </footer>

    <script>
        let userData = JSON.parse(localStorage.getItem('appUsers')) || {};

        // PRZEŁĄCZANIE MIĘDZY FORMULARZAMI
        document.getElementById('toRegister').onclick = function(e) {
            e.preventDefault();
            document.getElementById('loginDiv').style.display = 'none';
            document.getElementById('registerDiv').style.display = 'block';
        };
        document.getElementById('toLogin').onclick = function(e) {
            e.preventDefault();
            document.getElementById('registerDiv').style.display = 'none';
            document.getElementById('loginDiv').style.display = 'block';
        };

        // REJESTRACJA
        document.getElementById('registerBtn').onclick = function() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const passConf = document.getElementById('regPassConf').value;
            const privacyOk = document.getElementById('privacyCheck').checked;
            const errDiv = document.getElementById('regError');
            errDiv.style.display = 'none';

            if (!privacyOk) { errDiv.innerHTML = '❌ Musisz zaakceptować politykę prywatności!'; errDiv.style.display = 'block'; return false; }
            if (pass !== passConf) { errDiv.innerHTML = '❌ Hasła się nie zgadzają!'; errDiv.style.display = 'block'; return false; }
            if (pass.length < 6) { errDiv.innerHTML = '❌ Hasło musi mieć co najmniej 6 znaków!'; errDiv.style.display = 'block'; return false; }
            if (userData[email]) { errDiv.innerHTML = '❌ Ten email już istnieje!'; errDiv.style.display = 'block'; return false; }

            userData[email] = { username: username, email: email, password: pass };
            localStorage.setItem('appUsers', JSON.stringify(userData));
            localStorage.setItem('loggedUser', email);

            document.getElementById('regUsername').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPass').value = '';
            document.getElementById('regPassConf').value = '';
            document.getElementById('privacyCheck').checked = false;

            showProfile(userData[email]);
        };

        // LOGOWANIE
        document.getElementById('loginBtn').onclick = function() {
            const input = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            const errDiv = document.getElementById('loginError');
            errDiv.style.display = 'none';
            let foundUser = null;

            for (let key in userData) {
                const user = userData[key];
                if ((user.email === input || user.username === input) && user.password === pass) {
                    foundUser = user;
                    break;
                }
            }

            if (foundUser) {
                localStorage.setItem('loggedUser', foundUser.email);
                showProfile(foundUser);
            } else {
                errDiv.innerHTML = '❌ Błędny email/nazwa lub hasło!';
                errDiv.style.display = 'block';
            }
        };

        // WYLOGOWANIE
        document.getElementById('logoutBtn').onclick = function() {
            localStorage.removeItem('loggedUser');
            document.getElementById('profilePanel').style.display = 'none';
            document.getElementById('loginDiv').style.display = 'block';
            document.getElementById('registerDiv').style.display = 'none';
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPass').value = '';
        };

        // POKAŻ PROFIL + USTAWIENIA
        function showProfile(user) {
            document.getElementById('loginDiv').style.display = 'none';
            document.getElementById('registerDiv').style.display = 'none';
            document.getElementById('settingsDiv').style.display = 'none';
            document.getElementById('profilePanel').style.display = 'block';
            document.getElementById('profileName').textContent = user.username;
            document.getElementById('profileEmail').textContent = user.email;

            // Dodaj przycisk Ustawienia tylko raz
            if (!document.getElementById('settingsBtn')) {
                const profileCard = document.querySelector('.profile-card');

                const settingsBtn = document.createElement('button');
                settingsBtn.id = 'settingsBtn';
                settingsBtn.textContent = 'Ustawienia';
                settingsBtn.style.marginTop = '10px';
                settingsBtn.style.background = '#4da3ff';
                settingsBtn.style.color = '#fff';
                settingsBtn.style.border = 'none';
                settingsBtn.style.padding = '5px 10px';
                settingsBtn.style.cursor = 'pointer';
                settingsBtn.onclick = function() {
                    document.getElementById('profilePanel').style.display = 'none';
                    document.getElementById('settingsDiv').style.display = 'block';
                    document.getElementById('avatarInput').value = user.avatar || '👤';
                    document.getElementById('nameInput').value = user.username;
                    document.getElementById('passInput').value = '';
                    document.getElementById('settingsMsg').textContent = '';
                };
                profileCard.appendChild(settingsBtn);

                const betaInfo = document.createElement('p');
                betaInfo.textContent = 'Ta funkcja jest w becie 1.2';
                betaInfo.style.fontSize = '12px';
                betaInfo.style.color = '#888';
                betaInfo.style.marginTop = '5px';
                profileCard.appendChild(betaInfo);
            }
        }

        // ZAPISZ ZMIANY USTAWIEŃ
        document.getElementById('saveSettings').onclick = function() {
            const logged = localStorage.getItem('loggedUser');
            if (!logged || !userData[logged]) return;

            const user = userData[logged];
            const avatar = document.getElementById('avatarInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            const pass = document.getElementById('passInput').value;
            const msgDiv = document.getElementById('settingsMsg');
            msgDiv.style.color = 'red';
            msgDiv.textContent = '';

            if (name.length < 1) { msgDiv.textContent = '❌ Nazwa użytkownika nie może być pusta!'; return; }
            if (pass && pass.length < 6) { msgDiv.textContent = '❌ Hasło musi mieć co najmniej 6 znaków!'; return; }

            user.username = name;
            if (pass) user.password = pass;
            user.avatar = avatar;

            userData[logged] = user;
            localStorage.setItem('appUsers', JSON.stringify(userData));

            msgDiv.style.color = 'green';
            msgDiv.textContent = '✅ Zmiany zapisane!';
        };

        // POWRÓT DO PROFILU
        document.getElementById('backProfile').onclick = function() {
            const logged = localStorage.getItem('loggedUser');
            if (logged && userData[logged]) showProfile(userData[logged]);
        };

        // SPRAWDŹ CZY JUŻ ZALOGOWANY
        window.onload = function() {
            const logged = localStorage.getItem('loggedUser');
            if (logged && userData[logged]) {
                showProfile(userData[logged]);
            }
        };
    </script>
</body>
</html>
