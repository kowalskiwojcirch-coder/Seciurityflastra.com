<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Security Flastra</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f7fa; }
    nav.navbar { background:#4da3ff; color:white; display:flex; justify-content:space-between; padding:10px 20px; }
    nav.navbar .logo { font-weight:bold; }
    nav.navbar .nav-links { list-style:none; display:flex; gap:15px; margin:0; padding:0; }
    nav.navbar .nav-links li { cursor:pointer; }
    nav.navbar .nav-links li a { color:white; text-decoration:none; }

    section { max-width: 400px; margin: 40px auto; background:white; padding:20px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    input[type=text], input[type=password], input[type=file] { width:100%; padding:8px; margin:5px 0 15px 0; border:1px solid #ccc; border-radius:5px; }
    button { padding:8px 12px; background:#4da3ff; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#357ab8; }

    .error-message { color:red; margin-bottom:10px; }

    .profile-card { text-align:center; }
    .profile-avatar { font-size:50px; margin-bottom:10px; }
    .logout-btn { margin-top:15px; background:#ff5c5c; }
    .logout-btn:hover { background:#c03c3c; }

    .profile-settings { display:flex; justify-content:center; align-items:center; gap:6px; margin-top:10px; font-size:0.9em; color:#555; }
    .profile-settings button { background:none; border:none; cursor:pointer; font-size:1em; }
    .profile-settings button:hover { color:#4da3ff; }

    .settings-section { display:none; }
    .settings-card { background:#f0f4f8; padding:15px; border-radius:10px; margin-top:20px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    .settings-card h3 { margin-bottom:10px; font-size:1.1em; }
    .setting-item { margin-bottom:10px; display:flex; flex-direction:column; }
    .setting-item input { padding:6px 8px; border-radius:5px; border:1px solid #ccc; }
    #saveSettings { padding:8px 12px; background-color:#4da3ff; color:white; border:none; border-radius:5px; cursor:not-allowed; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo">Securityflastra.com</div>
  <ul class="nav-links">
    <li>Home Page</li>
    <li>Secretary</li>
    <li>Login</li>
    <li>🔍</li>
  </ul>
</nav>

<section id="loginSection">
  <!-- LOGOWANIE -->
  <div id="loginDiv">
    <h1>Logowanie</h1>
    <input type="text" id="loginEmail" placeholder="Email lub nazwa" required>
    <input type="password" id="loginPass" placeholder="Hasło" required>
    <button id="loginBtn">Zaloguj się</button>
    <p>Nie masz konta? <button id="toRegister" style="background:none;border:none;color:#4da3ff;cursor:pointer;text-decoration:underline;padding:0;">Rejestracja</button></p>
    <div id="loginError" class="error-message" style="display:none;"></div>
  </div>

  <!-- REJESTRACJA -->
  <div id="registerDiv" style="display:none;">
    <h1>Rejestracja</h1>
    <input type="text" id="regUsername" placeholder="Nazwa użytkownika" required>
    <input type="text" id="regEmail" placeholder="Email" required>
    <input type="password" id="regPass" placeholder="Hasło" required>
    <input type="password" id="regPassConf" placeholder="Potwierdź hasło" required>
    <div class="checkbox-group">
      <input type="checkbox" id="privacyCheck" required>
      <label for="privacyCheck">Akceptuję <strong>politykę prywatności</strong> i <strong>pliki cookies</strong></label>
    </div>
    <button id="registerBtn">Zarejestruj się</button>
    <p>Masz już konto? <button id="toLogin" style="background:none;border:none;color:#4da3ff;cursor:pointer;text-decoration:underline;padding:0;">Logowanie</button></p>
    <div id="regError" class="error-message" style="display:none;"></div>
  </div>
</section>

<!-- PROFIL -->
<section id="profilePanel" style="display:none;">
  <div class="profile-card">
    <div class="profile-avatar">👤</div>
    <h2 id="profileName"></h2>
    <p id="profileEmail"></p>

    <div class="profile-settings">
      <span>Ustawienia</span>
      <button id="openSettingsBtn" title="Otwórz ustawienia">⚙️</button>
    </div>

    <button id="logoutBtn" class="logout-btn">Wyloguj się</button>
  </div>
</section>

<!-- STRONA USTAWIEŃ -->
<section id="settingsSection" class="settings-section">
  <h1>Ustawienia konta</h1>
  <div class="settings-card">
    <div class="setting-item">
      <label>Zmiana nicku:</label>
      <input type="text" placeholder="Nowy nick" disabled>
    </div>
    <div class="setting-item">
      <label>Zmiana hasła:</label>
      <input type="password" placeholder="Nowe hasło" disabled>
    </div>
    <div class="setting-item">
      <label>Zmiana avatara:</label>
      <input type="file" disabled>
    </div>
    <button id="saveSettings" disabled>Zapisz zmiany</button>
    <p style="margin-top:10px;"><a href="#" id="backToProfile">⬅ Wróć do profilu</a></p>
  </div>
</section>

<footer style="text-align:center; margin-top:50px;">
  <p>&copy; 2024-2026 Security Flastra. Wszystkie prawa zastrzeżone.</p>
</footer>

<script>
let userData = JSON.parse(localStorage.getItem('appUsers')) || {};

// PRZEŁĄCZANIE FORMULARZY
document.getElementById('toRegister').onclick = e => {
  e.preventDefault();
  document.getElementById('loginDiv').style.display = 'none';
  document.getElementById('registerDiv').style.display = 'block';
};
document.getElementById('toLogin').onclick = e => {
  e.preventDefault();
  document.getElementById('registerDiv').style.display = 'none';
  document.getElementById('loginDiv').style.display = 'block';
};

// REJESTRACJA
document.getElementById('registerBtn').onclick = function() {
  const username = document.getElementById('regUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const passConf = document.getElementById('regPassConf').value;
  const privacyOk = document.getElementById('privacyCheck').checked;
  const errDiv = document.getElementById('regError');
  errDiv.style.display='none';

  if (!privacyOk) { errDiv.innerHTML='❌ Musisz zaakceptować politykę prywatności!'; errDiv.style.display='block'; return; }
  if (pass !== passConf) { errDiv.innerHTML='❌ Hasła się nie zgadzają!'; errDiv.style.display='block'; return; }
  if (pass.length<6) { errDiv.innerHTML='❌ Hasło musi mieć co najmniej 6 znaków!'; errDiv.style.display='block'; return; }
  if (userData[email]) { errDiv.innerHTML='❌ Ten email już istnieje!'; errDiv.style.display='block'; return; }

  userData[email] = { username, email, password: pass };
  localStorage.setItem('appUsers', JSON.stringify(userData));
  localStorage.setItem('loggedUser', email);
  document.getElementById('regUsername').value='';
  document.getElementById('regEmail').value='';
  document.getElementById('regPass').value='';
  document.getElementById('regPassConf').value='';
  document.getElementById('privacyCheck').checked=false;
  showProfile(userData[email]);
};

// LOGOWANIE
document.getElementById('loginBtn').onclick = function() {
  const input = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errDiv = document.getElementById('loginError');
  errDiv.style.display='none';

  let foundUser = null;
  for (let key in userData) {
    const user = userData[key];
    if ((user.email===input || user.username===input) && user.password===pass) { foundUser=user; break; }
  }
  if (foundUser) {
    localStorage.setItem('loggedUser', foundUser.email);
    showProfile(foundUser);
  } else { errDiv.innerHTML='❌ Błędny email/nazwa lub hasło!'; errDiv.style.display='block'; }
};

// WYLOGOWANIE
document.getElementById('logoutBtn').onclick = function() {
  localStorage.removeItem('loggedUser');
  document.getElementById('profilePanel').style.display='none';
  document.getElementById('loginSection').style.display='block';
  document.getElementById('settingsSection').style.display='none';
  document.getElementById('loginDiv').style.display='block';
};

// POKAŻ PROFIL
function showProfile(user) {
  document.getElementById('loginSection').style.display='none';
  document.getElementById('profilePanel').style.display='block';
  document.getElementById('settingsSection').style.display='none';
  document.getElementById('profileName').textContent=user.username;
  document.getElementById('profileEmail').textContent=user.email;
}

// OTWÓRZ USTAWIENIA
document.getElementById('openSettingsBtn').onclick = function() {
  document.getElementById('profilePanel').style.display='none';
  document.getElementById('settingsSection').style.display='block';
};

// POWRÓT DO PROFILU
document.getElementById('backToProfile').onclick = function(e) {
  e.preventDefault();
  document.getElementById('settingsSection').style.display='none';
  const logged = localStorage.getItem('loggedUser');
  if(logged && userData[logged]) showProfile(userData[logged]);
};

// SPRAWDŹ CZY ZALOGOWANY
window.onload = function() {
  const logged = localStorage.getItem('loggedUser');
  if(logged && userData[logged]) showProfile(userData[logged]);
};
</script>

</body>
</html>
